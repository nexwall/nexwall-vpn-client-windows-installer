name: Nexwall publish test build
# After the (upstream) "Build" workflow succeeds on main, attach the MSIs to the public pre-release "nightly".
# These builds are NOT code-signed: Windows SmartScreen will warn. For testing only.
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the MSIs of the build
        run: |
          mkdir -p dl dist
          gh run download ${{ github.event.workflow_run.id }} --repo "$GITHUB_REPOSITORY" --pattern '*.msi' --dir dl
          find dl -type f
          for f in $(find dl -type f -name '*.msi'); do
            arch=$(echo "$f" | sed -E 's/.*-(x86|amd64|arm64)\.msi$/\1/')
            cp "$f" "dist/nexwall-vpn-windows-$arch-${GITHUB_SHA::7}.msi"
          done
          ls -l dist
      - name: Publish to the pre-release "nightly"
        run: |
          SHA=${{ github.event.workflow_run.head_sha }}
          gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create nightly --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
              --title "Nexwall VPN for Windows - test build (unsigned)" --notes "placeholder"
          gh release upload nightly dist/*.msi --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Nexwall VPN for Windows - test build (unsigned)" \
            --notes "Automatic test build of commit ${SHA::7}. NOT code-signed (SmartScreen will warn). Source: this repository and nexwall-vpn-client-windows. Based on OpenVPN (GPLv2)."
